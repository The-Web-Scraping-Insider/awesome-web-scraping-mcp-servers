# Source of truth for the list. README.md and the pages in categories/ and
# vendors/ are generated from this file by scripts/render.py. Edit here, never
# in README.md.
#
# Fields
#   id           unique slug
#   name         server name
#   vendor       id from vendors.yaml, for official servers; omit for community servers
#   author       GitHub user/org, for community servers
#   type         official-vendor | official-tool | community
#   category     see data/categories.yaml
#   repo         owner/repo on GitHub (used for stars). Omit if closed source.
#   catalog      true if the repo is a bigger project, so its stars say little about the MCP server itself
#   url          link, if it differs from https://github.com/<repo>
#   description  one sentence, no marketing language
#   hosting      hosted | local | both   (hosted = remote MCP endpoint run by the vendor)
#   endpoint     remote MCP URL, if hosted
#   paid_api     true if it needs a paid account or API key to be useful
#   free_tier    short note on the free plan, as stated in the vendor's docs
#   capabilities tags from data/capabilities.yaml
#   install      one-line install or connect command
#   added        date added to this list

