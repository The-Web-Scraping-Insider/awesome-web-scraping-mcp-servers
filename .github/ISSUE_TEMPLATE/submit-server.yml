name: Submit an MCP server
description: Suggest a web scraping MCP server for the list
title: "Add server: "
labels: ["new server"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Servers must be about getting data from the web: scraping, crawling, browser automation, proxies or extraction.
        Vendors are welcome to submit their own servers; they are ranked by the same rules as everyone else.
  - type: input
    id: link
    attributes:
      label: Link to the server
      description: GitHub repo, or the docs page for closed-source servers
      placeholder: https://github.com/owner/my-mcp-server
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Server name
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What does it do?
      description: One plain sentence. No marketing language, please.
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Who publishes it?
      options:
        - The company or project behind the tool (official)
        - An independent developer (community)
    validations:
      required: true
  - type: dropdown
    id: hosting
    attributes:
      label: How is it run?
      options:
        - Hosted (remote endpoint run by the vendor)
        - Local (npx, uvx, pip or Docker)
        - Both
    validations:
      required: true
  - type: input
    id: endpoint
    attributes:
      label: Remote endpoint URL (if hosted)
      placeholder: https://mcp.example.com/mcp
  - type: dropdown
    id: paid
    attributes:
      label: Does it need a paid account or API key?
      options:
        - "No"
        - "Yes"
        - Free tier available
    validations:
      required: true
  - type: input
    id: install
    attributes:
      label: Install command
      placeholder: npx -y my-mcp-server
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: It is an MCP server and works with at least one client (Claude, Cursor, VS Code…)
          required: true
        - label: It isn't already in the list
          required: true
